[project]
name = "container-function-python"
version = "0.1.0"
description = "Aire Labs Container Function — Python example (LCOE calculator)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# Runtime has no third-party dependencies — the Hook I/O helpers use only the
# standard library (json, csv, datetime). This keeps the Docker image tiny.
dependencies = []

[project.scripts]
lcoe = "main:main"

[dependency-groups]
# Dev-only tools, installed by `uv sync` but never shipped in the image.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# Standalone project (not a member of the siro uv workspace), so it builds and
# runs identically inside the Docker image and on a developer's machine.
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the package plus the root-level entry point so `lcoe`/`python main.py`
# both resolve.
packages = ["lcoe"]
include = ["main.py"]

[tool.pytest.ini_options]
# Let `import main` / `import lcoe...` resolve from the project root.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
