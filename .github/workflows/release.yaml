name: Release

# Build and push the LCOE container-function image to the Aire Labs registry.
# The heavy lifting (install deps via the moon Python/uv toolchain, test, lint,
# docker build + push) lives in scripts/release.sh and is invoked through
# `moon run lcoe:release` — the SAME entry point you run locally, so CI and a
# developer machine do identical work.
#
# STAGE ONLY for now. Every release goes to the stage registry
# (org-<id>.registry-stage.airelabs.studio). Production is intentionally not
# wired up yet — when it is, add a `v*` tag trigger that resolves env=production
# and a REGISTRY_API_KEY_PROD secret.
#
# Triggers & docker tags (the registry enforces IMMUTABLE tags, so every tag is
# unique and pushed exactly once — there is no `:latest`):
#   - push to main     → tag "branch-main-<shortsha>" (e.g. branch-main-1234567)
#   - manual dispatch  → tag "branch-<branch>-<shortsha>" (derived by release.sh)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialize per ref so two pushes to the same ref don't race on the same tag,
# but never cancel an in-flight publish (a half-pushed image is worse than a
# queued one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history + tags so scripts/release.sh can resolve the
          # branch + sha for the docker tag.
          fetch-depth: 0

      # Provisions the Python + uv versions pinned in .prototools via proto, and
      # (because installDependencies defaults on for the unstable_python
      # toolchain) lets `moon run` do the cached `uv sync` itself — no
      # astral-sh/setup-uv, no hand-rolled install step. Same as siro's pattern.
      - name: Setup moon toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      # Docker buildx for the build/push in scripts/release.sh.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build + test + lint + push, all via the one moon task. release.sh derives
      # the per-org registry host from REGISTRY_ORG_ID + RELEASE_ENV (stage); the
      # only secret it needs is the stage API key.
      #
      # Set under Settings → Secrets and variables → Actions:
      #   Variables: REGISTRY_ORG_ID   (your org id — not sensitive)
      #   Secrets:   REGISTRY_API_KEY_STAGE   (the stage registry API key)
      - name: Build and push image
        env:
          RELEASE_ENV: stage
          # Let release.sh derive the tag (branch-<branch>-<shortsha>).
          RELEASE_VERSION: ''
          # The Aire Labs registry login username (not a secret; the API key is).
          REGISTRY_USERNAME: api-key
          REGISTRY_ORG_ID: ${{ vars.REGISTRY_ORG_ID }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_API_KEY_STAGE }}
        run: moon run lcoe:release
