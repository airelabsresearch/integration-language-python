name: Release

# Build and push the LCOE container-function image to the Aire Labs registry.
# The heavy lifting (install deps via the moon Python/uv toolchain, test, lint,
# docker build + push) lives in scripts/release.sh and is invoked through
# `moon run lcoe:release` — the SAME entry point you run locally, so CI and a
# developer machine do identical work.
#
# STAGE ONLY for now. Every release (including tagged ones) goes to the stage
# registry (org-<id>.registry-stage.airelabs.studio). Production is not wired up
# yet — when it is, route tag pushes to env=production + a REGISTRY_API_KEY_PROD
# secret.
#
# Triggers & docker tags (the registry enforces IMMUTABLE tags, so every tag is
# unique and pushed exactly once — there is no `:latest`):
#   - push of a tag `v*`  → tag "<git tag>" (e.g. v2026-06-10-001) + a GitHub Release
#   - push to main        → tag "branch-main-<shortsha>" (e.g. branch-main-1234567)
#   - manual dispatch     → tag "branch-<branch>-<shortsha>" (derived by release.sh)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Serialize per ref so two pushes to the same ref don't race on the same tag,
# but never cancel an in-flight publish (a half-pushed image is worse than a
# queued one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # contents: write only so the tag-push path can create a GitHub Release.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history + tags so scripts/release.sh can resolve the
          # branch + sha for the docker tag.
          fetch-depth: 0

      # Provisions the Python + uv versions pinned in .prototools via proto, and
      # (because installDependencies defaults on for the unstable_python
      # toolchain) lets `moon run` do the cached `uv sync` itself — no
      # astral-sh/setup-uv, no hand-rolled install step. Same as siro's pattern.
      - name: Setup moon toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      # Docker buildx for the build/push in scripts/release.sh.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # On a tag push, pin the docker tag to the git tag (the preferred,
      # human-named release tag, e.g. v2026-06-10-001). On main / dispatch leave
      # it empty so release.sh derives "branch-<branch>-<shortsha>".
      - name: Resolve docker tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release_version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_version=" >> "$GITHUB_OUTPUT"
          fi

      # Build + test + lint + push, all via the one moon task. release.sh derives
      # the per-org registry host from REGISTRY_ORG_ID + RELEASE_ENV (stage); the
      # only secret it needs is the stage API key.
      #
      # Set under Settings → Secrets and variables → Actions:
      #   Variables: REGISTRY_ORG_ID   (your org id — not sensitive)
      #   Secrets:   REGISTRY_API_KEY  (the registry API key)
      - name: Build and push image
        env:
          RELEASE_ENV: stage
          RELEASE_VERSION: ${{ steps.tag.outputs.release_version }}
          # The Aire Labs registry login username (not a secret; the API key is).
          REGISTRY_USERNAME: api-key
          REGISTRY_ORG_ID: ${{ vars.REGISTRY_ORG_ID }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_API_KEY }}
        run: moon run lcoe:release

      # On a tag push, publish a GitHub Release pointing at the image just pushed.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="org-${{ vars.REGISTRY_ORG_ID }}.registry-stage.airelabs.studio/lcoe-python:${{ github.ref_name }}"
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Container image (immutable tag) pushed to the Aire Labs registry:

          \`\`\`
          $IMAGE
          \`\`\`"
